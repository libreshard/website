<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- L: double outline with diagonal cuts -->
  <g fill="none" stroke="url(#cyan)" stroke-linejoin="round" filter="url(#glow)">
    <path d="M64 64 L128 104 L128 384 L392 384 L448 448 L64 448 Z" stroke-width="18"/>
    <path d="M94 116 L102 121 L102 418 L414 418" stroke-width="7" opacity=".75"/>
  </g>

  <!-- Waves -->
  <g fill="none" stroke="#fbbf24" stroke-linecap="round" stroke-width="7">
    <path d="M229.0 147.8 A112 112 0 0 1 359.5 303.3" opacity=".85"/>
    <path d="M221.8 120.8 A140 140 0 0 1 384.9 315.2" opacity=".5"/>
  </g>

  <!-- Button -->
  <g filter="url(#glow)">
    <rect x="196" y="194" width="124" height="124" rx="28" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <rect x="220" y="218" width="76" height="76" rx="14" fill="url(#gold)"/>
  </g>

  <!-- Sparkle -->
  <path d="M337 153 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 Z" fill="#fef3c7"/>
</svg>
